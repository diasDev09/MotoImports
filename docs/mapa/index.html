/* Layout: cabeçalho compacto, grafo à esquerda, painel de leitura à direita (empilha no celular).

:root{
  --ivory:#F9F8F7; --almond:#EDEAE4; --mist:#ADB8BB; --navy:#153147; --noir:#232A2F;
  --bg:var(--ivory); --surface:var(--almond); --fg:var(--noir); --muted:#4A565C; --line:#C9CFD0; --accent:var(--navy); --on-accent:var(--ivory);

  --l-login:#b9502e; --l-armazenamento:#8a7a1f; --l-infra:#5b6a72; --l-testes:#8f9aa0;
  --display:Georgia,"Times New Roman",Times,serif;
  --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

  --bg:#171d21; --surface:#1f272c; --fg:#ECE8E1; --muted:#AEB9BD; --line:#34414a; --accent:#ADB8BB; --on-accent:#171d21;
  --edge:#5d6d75; --halo:#171d21;
  --l-telas:#6fa8dc; --l-componentes:#5cc2c9; --l-estado:#e0b04f; --l-regras:#b98ad6; --l-dados:#9bc65a;

:root[data-theme="dark"]{
  --bg:#171d21; --surface:#1f272c; --fg:#ECE8E1; --muted:#AEB9BD; --line:#34414a; --accent:#ADB8BB; --on-accent:#171d21;
  --edge:#5d6d75; --halo:#171d21;
  --l-telas:#6fa8dc; --l-componentes:#5cc2c9; --l-estado:#e0b04f; --l-regras:#b98ad6; --l-dados:#9bc65a;
  --l-login:#ee8a66; --l-armazenamento:#d1c25a; --l-infra:#93a3ab; --l-testes:#7d8b92; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1400px;margin-inline:auto;padding-block:20px 28px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between}
header.top h1{font-size:clamp(1.5rem,3.2vw,2.1rem);letter-spacing:-.01em}
.meta{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;min-width:0;display:flex}
.search input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1.5px solid var(--accent);background:var(--bg);color:var(--fg);border-radius:0}
.btn{padding:8px 14px;border:1.5px solid var(--accent);background:transparent;cursor:pointer;font-weight:700;border-radius:0}
.btn:hover{background:var(--accent);color:var(--on-accent)}
.btn[aria-pressed="true"],.btn.primary{background:var(--accent);color:var(--on-accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:.85rem;border-radius:0}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.chip em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:14px;align-items:start}
.graph{position:relative;background:var(--surface);border:1.5px solid var(--line);min-width:0;height:min(74vh,760px);min-height:420px;overflow:hidden}
.graph svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.graph svg:active{cursor:grabbing}
.hint{position:absolute;left:10px;bottom:8px;font-size:.78rem;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:2px 6px;pointer-events:none}

.zoom button:hover{background:var(--accent);color:var(--on-accent)}
.node{cursor:pointer;outline:none}
.node path{stroke:var(--halo);stroke-width:1.5px;transition:opacity .15s}
.node:focus-visible path{stroke:var(--accent);stroke-width:3px}
.node.sel path{stroke:var(--fg);stroke-width:3px}
.label{font-size:11px;fill:var(--fg);paint-order:stroke;stroke:var(--halo);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;font-family:var(--sans)}
.edge{stroke:var(--edge);fill:none;stroke-width:1;opacity:.45}
.edge.implements{stroke-dasharray:3 3;opacity:.3}
.edge.tests{stroke-dasharray:1.5 3}
.edge.hot{stroke:var(--fg);opacity:.95;stroke-width:1.6}
.dim{opacity:.12}
aside{background:var(--surface);border:1.5px solid var(--line);min-width:0;display:flex;flex-direction:column;max-height:min(74vh,760px)}
.tabs{display:flex;border-bottom:1.5px solid var(--line)}
.tabs button{flex:1;padding:10px;border:0;background:transparent;cursor:pointer;font-weight:700;border-bottom:3px solid transparent;border-radius:0}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent)}
.pane{padding:14px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.pane h2{font-size:1.25rem;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:2px 8px;border:1.5px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.path{font-family:var(--mono);font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.group h3{font-size:.78rem;font-family:var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.links{display:flex;flex-direction:column;gap:2px}
.links button{text-align:left;border:0;background:transparent;padding:4px 6px;cursor:pointer;display:flex;gap:8px;align-items:baseline;border-radius:0;min-width:0}
.links button:hover{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.links b{font-weight:600;overflow-wrap:anywhere}
.links small{color:var(--muted);flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;align-self:center}
.layerhead{display:flex;gap:8px;align-items:center;margin-top:6px}
.layerhead p{margin:0;color:var(--muted);font-size:.85rem}
.step{display:flex;flex-direction:column;gap:10px}
.step .count{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.step .nav{display:flex;gap:8px}
.empty{color:var(--muted);margin:0}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}.graph{height:64vh;min-height:380px}aside{max-height:none}.pane{overflow:visible}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html,body{margin:0}
:root{color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark}}
</style>

        <button role="tab" id="tabTour" aria-selected="false" type="button">Tour</button>
      </div>
      <div class="pane" id="pane" role="tabpanel" aria-live="polite"></div>
    </aside>
  </main>
</div>

function visible(n){

  selN=gN.selectAll('g.node').data(vn,d=>d.id).join(en=>{

    g.on('click',(e,d)=>{e.stopPropagation();select(d.id)}).on('keydown',(e,d)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(d.id)}})
     .on('mouseenter',(e,d)=>hover(d)).on('mouseleave',()=>hover(null)).on('focus',(e,d)=>hover(d)).on('blur',()=>hover(null))
     .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

  for(let i=0;i<260;i++)sim.tick();

document.getElementById('tabTour').onclick=()=>{state.tour<0?startTour(0):setMode('tour')};
document.getElementById('zin').onclick=()=>svg.transition().duration(200).call(zoom.scaleBy,1.4);
document.getElementById('zout').onclick=()=>svg.transition().duration(200).call(zoom.scaleBy,1/1.4);
document.getElementById('zfit').onclick=()=>fit();
svg.on('click',()=>{if(state.sel)select(null)});
document.getElementById('busca').oninput=e=>{state.q=e.target.value.trim();paint();if(state.mode==='exp'&&!state.sel)renderExplore()};
const chips=document.getElementById('chips');
function syncChips(){
  chips.innerHTML='';
  G.layers.forEach(l=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.style.setProperty('--c',lc(l.id));
    b.setAttribute('aria-pressed',state.layers.has(l.id));b.title=l.description;
    b.innerHTML=`<i></i>${esc(l.name)} <em>${l.nodeIds.length}</em>`;
    b.onclick=()=>{
      if(l.id==='testes'){setTest(!state.showTests);}
      else{state.layers.has(l.id)?state.layers.delete(l.id):state.layers.add(l.id);syncChips();rebuild(true)}
      if(state.mode==='exp')renderExplore();
    };
    chips.appendChild(b);
  });
}
syncChips();rebuild(false);setMode('exp');
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>fit(state.tour>=0?G.tour[state.tour].nodeIds:null),150)}).observe(document.querySelector('.graph'));
fit();
})();
</script>
</body>
</html>
